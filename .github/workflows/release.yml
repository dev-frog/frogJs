name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v0.3.0 or v0.3.0-rc.1). Tag is created from the selected branch.'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$TAG'. Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-suffix"
            exit 1
          fi

          if [[ "$TAG" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (prerelease: $PRERELEASE)"

      - name: Create tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install dependencies
        run: brew install v8 libuv

      - name: Build FrogJS
        run: |
          make clean
          make all \
            V8_PATH="$(brew --prefix v8)" \
            LIBUV_PATH="$(brew --prefix libuv)"

      - name: Smoke test
        run: ./build/frogjs examples/hello.js

      - name: Package
        id: package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          NAME="frogjs-${VERSION}-${TARGET}"
          mkdir -p "dist/$NAME"
          cp build/frogjs README.md LICENSE "dist/$NAME/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          (cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frogjs-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG}"
          else
            RANGE="$TAG"
          fi

          {
            echo "## FrogJS ${VERSION}"
            echo ""
            echo "### Changes"
            git log --no-merges --pretty=format:'- %s (%h)' "$RANGE"
            echo ""
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
              echo ""
            fi
            echo "### Downloads"
            for f in dist/*.tar.gz; do
              echo "- \`$(basename "$f")\`"
            done
            echo ""
            echo "### Installation (macOS)"
            echo '```bash'
            echo "brew install v8 libuv"
            echo "tar -xzf frogjs-${VERSION}-macos-arm64.tar.gz"
            echo "./frogjs-${VERSION}-macos-arm64/frogjs script.js"
            echo '```'
            echo ""
            echo "Verify the download with \`shasum -a 256 -c <file>.sha256\`."
          } > release_notes.md

          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: FrogJS ${{ needs.prepare.outputs.version }}
          body_path: release_notes.md
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true

      - name: Summary
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "## Release $TAG published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
