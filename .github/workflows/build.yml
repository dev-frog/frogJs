name: Build FrogJS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        echo "Installing V8 and libuv via Homebrew..."
        brew install v8 libuv

    - name: Build FrogJS
      run: |
        make clean || true
        make all WERROR=1

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install lint and type-check tools
      run: npm ci

    - name: Test
      run: make test

    - name: Lint
      run: make lint

    - name: Check TypeScript declarations
      run: make check-types

    - name: Check the API reference
      run: make check-docs

    - name: Tests under AddressSanitizer and UndefinedBehaviorSanitizer
      run: make test-asan

    - name: Native leaks
      run: make leakcheck

    - name: Coverage (at least 90%)
      run: make coverage COVERAGE_MIN=90

    # Last: it leaves many ports in TIME_WAIT, which can starve tests that connect
    - name: Fuzz the HTTP parser and Buffer
      run: make fuzz
      env:
        FUZZ_SECONDS: 15

    - name: Upload build artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: frogjs-macos
        path: build/frogjs
        retention-days: 90
